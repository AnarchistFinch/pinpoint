<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
    }

    #status {
      color: #666;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <h1>Hottest 100 Pinpoint</h1>
  
  <div id="status">Loading songs...</div>
<div id="setupArea">
  <label>Players</label>

  <select id="playerCount" onchange="updatePlayerInputs()">
    <option value="1">1 Player</option>
    <option value="2">2 Players</option>
    <option value="3">3 Players</option>
    <option value="4">4 Players</option>
  </select>
<div id="playerNames"></div>
  <button onclick="startGame()">Start Game</button>
</div>
  <div id="currentPlayer"></div>

  <div id="scoreboard"></div>

<div id="gameArea" style="display:none;">

  <select id="decade">
    <option value="1950s">1950s</option>
    <option value="1960s">1960s</option>
    <option value="1970s">1970s</option>
    <option value="1980s">1980s</option>
    <option value="1990s">1990s</option>
    <option value="2000s">2000s</option>
    <option value="2010s">2010s</option>
  </select>

  <input
    type="text"
    id="songInput"
    placeholder="Enter song title">

  <button onclick="searchSong()">Search</button>

  <div id="result"></div>

<img
  id="coverArt"
  style="
    display:none;
    width:300px;
    height:300px;
    object-fit:cover;
    margin:20px auto;
    border-radius:8px;
  ">

</div>
  <script>
    let songs = [];
    let guessedSongs = new Set();
    let playerScores = [];
    let playerStrikes = [];
    let playerNames = [];
    let playerCount = 1;
    let currentPlayer = 0;
    let eliminatedPlayers = [];
    let direction = 1;
    let gameOver = false;

function updatePlayerInputs() {

  const count =
    Number(document.getElementById('playerCount').value);

  let html = '';

  for (let i = 1; i <= count; i++) {

    html += `
      <input
        type="text"
        id="playerName${i}"
        placeholder="Player ${i} Name">
    `;
  }

  document.getElementById('playerNames').innerHTML =
    html;
}

    function normalise(text) {
      return String(text)
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
    }

    function doGet() {
  return HtmlService.createHtmlOutputFromFile('Index')
    .setTitle('Song Lookup');
}

async function loadSongs() {

  try {

    const response =
      await fetch('./songs.json');

    songs =
      await response.json();

    document.getElementById('status')
      .style.display = 'none';

    console.log(
      'Loaded',
      songs.length,
      'songs'
    );

  } catch (error) {

    console.error(error);

    document.getElementById('status')
      .textContent =
      'Failed to load songs';
  }
}

    function startGame() {

        playerCount =
    Number(document.getElementById('playerCount').value);

eliminatedPlayers =
  Array(playerCount).fill(false);
playerNames = [];

gameOver = false;

for (let i = 1; i <= playerCount; i++) {

  const name =
    document.getElementById('playerName' + i).value.trim();

  playerNames.push(
    name || ('Player ' + i)
  );
}
  guessedSongs = new Set();
  document.getElementById('coverArt').style.display =
  'none';
  document.getElementById('result').textContent = '';

  playerScores =
    Array(playerCount).fill(0);

  playerStrikes =
    Array(playerCount).fill(0);

  currentPlayer = 0;
  direction = 1;

  updateScoreboard();
  document.getElementById('gameArea').style.display =
  'block';
  document.getElementById('setupArea').style.display =
  'none';
}

function updateScoreboard() {

  let html = '';

  for (let i = 0; i < playerCount; i++) {

    html +=
  '<div>' +
  playerNames[i] +
  ' — Score: ' + playerScores[i] +
  ' | Strikes: ' + playerStrikes[i];

if (eliminatedPlayers[i]) {
  html += ' (OUT)';
}

html += '</div>';
  }

  document.getElementById('scoreboard').innerHTML =
    html;

  document.getElementById('currentPlayer').innerHTML =
    '<h2>' +
    playerNames[currentPlayer] +
    '\'s Turn</h2>';
}

function nextPlayer() {

  let attempts = 0;

  do {

    if (playerCount <= 2) {

      currentPlayer =
        (currentPlayer + 1) % playerCount;

    } else {

      currentPlayer += direction;

      if (currentPlayer >= playerCount) {
        currentPlayer = playerCount - 1;
        direction = -1;
      }

      else if (currentPlayer < 0) {
        currentPlayer = 0;
        direction = 1;
      }
    }

    attempts++;

  } while (
    eliminatedPlayers[currentPlayer] &&
    attempts < playerCount * 2
  );

  updateScoreboard();
}

    async function searchSong() {
      if (gameOver) {
  return;
}
if (eliminatedPlayers[currentPlayer]) {
  nextPlayer();
  return;
}
  const decade =
    document.getElementById('decade').value;

  const searchTerm =
    normalise(
      document.getElementById('songInput').value
    );

  const uniqueKey =
    decade + "|" + searchTerm;

  const match = songs.find(song =>
    song.decade === decade &&
    normalise(song.title) === searchTerm
  );

if (match) {

  if (guessedSongs.has(uniqueKey)) {

    document.getElementById('result').textContent =
      'Already guessed: ' + match.title;

    document.getElementById('songInput').value = '';
    document.getElementById('songInput').focus();

    return;
  }

  guessedSongs.add(uniqueKey);

  playerScores[currentPlayer] +=
  Number(match.number);

  document.getElementById('result').textContent =
    '✓ ' + match.number;
    try {

  const response = await fetch(
    'https://itunes.apple.com/search?term=' +
    encodeURIComponent(
  match.title + ' ' + match.artist
) +
    '&entity=song&limit=1'
  );

  const data = await response.json();

  if (data.results.length > 0) {

    const artwork =
      data.results[0].artworkUrl100
        .replace('100x100', '600x600');

    const img =
      document.getElementById('coverArt');

    img.src = artwork;
    img.style.display = 'block';
  }
    updateScoreboard();
nextPlayer();

} catch (err) {
  console.error(err);
}
document.getElementById('songInput').value = '';
document.getElementById('songInput').focus();
} else {
  document.getElementById('coverArt').style.display =
    'none';
  playerStrikes[currentPlayer]++;

if (playerStrikes[currentPlayer] >= 3) {

  eliminatedPlayers[currentPlayer] = true;
  const everyoneOut =
  eliminatedPlayers.every(player => player);

document.getElementById('result').textContent =
  playerNames[currentPlayer] +
  ' is OUT! Final Score: ' +
  playerScores[currentPlayer];
if (everyoneOut) {

  let winningScore = -1;
  let winner = '';

  for (let i = 0; i < playerCount; i++) {

    if (playerScores[i] > winningScore) {

      winningScore = playerScores[i];
      winner = playerNames[i];
    }
  }

  document.getElementById('result').innerHTML =
    '<h2>Game Over</h2>' +
    winner +
    ' wins with ' +
    winningScore +
    ' points!';

  gameOver = true;

  return;
}
} else {

  document.getElementById('result').textContent =
    '✗ Song not found';

}

updateScoreboard();
nextPlayer();

document.getElementById('songInput').value = '';
document.getElementById('songInput').focus();
}
}
document
  .getElementById('songInput')
  .addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      searchSong();
    }
  });
updatePlayerInputs();
loadSongs();
  </script>

</body>
</html>
